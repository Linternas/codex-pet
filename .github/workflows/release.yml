name: Release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-darwin-arm64:
    runs-on: macos-15
    env:
      CODEX_PET_CODESIGN_IDENTITY: ${{ secrets.CODEX_PET_CODESIGN_IDENTITY }}
      CODEX_PET_NOTARIZE: "1"
      CODEX_PET_NOTARY_KEY_ID: ${{ secrets.CODEX_PET_NOTARY_KEY_ID }}
      CODEX_PET_NOTARY_ISSUER_ID: ${{ secrets.CODEX_PET_NOTARY_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          CODEX_PET_CERTIFICATE_BASE64: ${{ secrets.CODEX_PET_CERTIFICATE_BASE64 }}
          CODEX_PET_CERTIFICATE_PASSWORD: ${{ secrets.CODEX_PET_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CODEX_PET_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CODEX_PET_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CODEX_PET_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Write notarization API key
        env:
          CODEX_PET_NOTARY_PRIVATE_KEY: ${{ secrets.CODEX_PET_NOTARY_PRIVATE_KEY }}
        run: |
          printf "%s" "$CODEX_PET_NOTARY_PRIVATE_KEY" > notary-key.p8

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Package signed DMG
        env:
          CODEX_PET_NOTARY_KEY_PATH: ${{ github.workspace }}/notary-key.p8
        run: pnpm package:dmg

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "Codex Pet ${{ inputs.tag }}"

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" release/*.dmg release/latest-darwin-arm64.json --clobber
